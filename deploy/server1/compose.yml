# EC2 Tokyo Server 1: app, API, workers, web, reverse proxy.
# Bind only loopback until a proper domain and TLS are configured.
x-app: &app
  build:
    context: ../..
    dockerfile: deploy/Dockerfile.api
  restart: unless-stopped
  env_file: .env

services:
  api:
    <<: *app
    command: ["api"]
    expose: ["8080"]
  outbox:
    <<: *app
    command: ["outbox"]
  worker:
    <<: *app
    command: ["worker"]
  cleanup:
    <<: *app
    command: ["cleanup"]
  web:
    build: ../../web
    restart: unless-stopped
    expose: ["3000"]
  proxy:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports: ["127.0.0.1:8088:80"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [api,web]
